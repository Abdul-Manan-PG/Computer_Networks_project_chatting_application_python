<!DOCTYPE html>
<html>
<head>
<title>Chat Go</title>
<style>
body{margin:0;font-family:'Segoe UI',sans-serif;display:flex;height:100vh;overflow:hidden}
#sidebar{width:300px;background:#f0f2f5;border-right:1px solid #ddd;display:flex;flex-direction:column}
#main{flex:1;display:flex;flex-direction:column;background:white}
.header{padding:15px;background:white;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between}
.list{flex:1;overflow-y:auto;padding:10px}
.item{padding:10px;cursor:pointer;border-radius:8px;display:flex;align-items:center;margin-bottom:5px}
.item:hover{background:#e4e6eb}
.item.active{background:#e6f2ff}
.status{width:10px;height:10px;border-radius:50%;margin-left:auto}
.online{background:#31a24c} .offline{background:#bcc0c4}
#msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:70%;padding:10px 15px;border-radius:18px;word-wrap:break-word}
.me{align-self:flex-end;background:#0084ff;color:white}
.other{align-self:flex-start;background:#f0f2f5;color:black}
.controls{padding:15px;border-top:1px solid #ddd;display:flex;gap:10px}
input{flex:1;padding:10px;border:1px solid #ddd;border-radius:20px;outline:none}
button{padding:8px 15px;border:none;border-radius:6px;cursor:pointer;background:#e4e6eb}
.blue-btn{background:#0084ff;color:white}
/* Call Modal */
#call-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:black;z-index:100;flex-direction:column}
#video-grid{flex:1;display:flex;flex-wrap:wrap;gap:10px;padding:20px;justify-content:center;align-content:center}
video{width:300px;height:225px;background:#333;border-radius:8px;object-fit:cover}
.call-controls{padding:20px;display:flex;justify-content:center;gap:20px;background:rgba(0,0,0,0.8)}
.red-btn{background:red;color:white;font-weight:bold;padding:10px 20px}
</style>
</head>
<body>

<div id="sidebar">
    <div class="header">
        <h2 style="margin:0;color:#0084ff">Chat Go</h2>
        <small>{{ username }}</small>
        <a href="/logout" style="color:red;text-decoration:none">Exit</a>
    </div>
    <div style="padding:10px;display:flex;gap:5px">
        <button onclick="addFriend()">+ Friend</button>
        <button onclick="createGroup()">+ Group</button>
    </div>
    <div class="list" id="list-area"></div>
</div>

<div id="main">
    <div class="header" id="chat-header" style="visibility:hidden">
        <h3 style="margin:0" id="chat-title"></h3>
        <div>
            <button onclick="addMember()" id="btn-add-mem" style="display:none">+ Mem</button>
            <button onclick="startCall('audio')">📞</button>
            <button onclick="startCall('video')">📹</button>
        </div>
    </div>
    <div id="msgs"></div>
    <div class="controls" id="input-area" style="visibility:hidden">
        <input type="file" id="file-in" hidden onchange="uploadFile()">
        <button onclick="document.getElementById('file-in').click()">📎</button>
        <input type="text" id="msg-in" placeholder="Type a message...">
        <button class="blue-btn" onclick="sendMsg()">Send</button>
    </div>
</div>

<!-- Call UI -->
<div id="call-modal">
    <div id="video-grid">
        <!-- Local Video -->
        <div style="position:relative">
            <video id="local-video" autoplay muted playsinline></video>
            <div style="position:absolute;bottom:5px;left:5px;color:white;background:rgba(0,0,0,0.5);padding:2px 5px;border-radius:4px">You</div>
        </div>
    </div>
    <div class="call-controls">
        <button class="red-btn" onclick="leaveCall()">End Call</button>
    </div>
</div>

<script>
const myUser = "{{ username }}";
let currChat = null;
let isGroup = false;
let pollInterval = null;

// WebRTC Globals
let localStream;
let peers = {}; // { "username": RTCPeerConnection }
let currentRoom = null;
const rtcConfig = {iceServers: [{urls: 'stun:stun.l.google.com:19302'}]};

window.onload = () => {
    updateFeed();
    pollInterval = setInterval(pollUpdates, 500);
};

// --- API ---
async function api(url, data) {
    return fetch('/api/'+url, {
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)
    }).then(r=>r.json());
}

// --- Updates & Polling ---
async function pollUpdates() {
    const res = await fetch('/api/updates');
    const msgs = await res.json();
    
    for (let m of msgs) {
        if (m.type === 'FRIENDS' || m.type === 'GROUPS') renderSidebar(m);
        else if (m.type === 'MESSAGE') {
            // Play sound?
            if ((m.group && m.group === currChat) || (!m.group && m.from === currChat) || (m.from === myUser && currChat)) {
                renderMsg(m);
            }
        }
        else if (m.type === 'HISTORY') {
            document.getElementById('msgs').innerHTML = '';
            m.data.forEach(h => renderMsg({from:h[0], content:h[1], is_file:h[2], time:h[3]}));
        }
        
        // WebRTC Signaling
        else if (m.type === 'PEER_JOINED') {
            // m.peer joined my room. I should call them.
            initiateConnection(m.peer);
        }
        else if (m.type === 'EXISTING_PEER') {
            // I joined, m.peer is already there. Wait for their offer.
        }
        else if (m.type === 'SIGNAL') {
            handleSignal(m.from, m.signal);
        }
        else if (m.type === 'PEER_LEFT') {
            removePeer(m.peer);
        }
    }
}

function updateFeed() {
    api('action', {command: 'GET_FRIENDS'});
    api('action', {command: 'GET_GROUPS'});
}

// --- UI Rendering ---
let friends = [], groups = [];

function renderSidebar(m) {
    if (m.type === 'FRIENDS') friends = m.data;
    if (m.type === 'GROUPS') groups = m.data;
    
    const d = document.getElementById('list-area');
    d.innerHTML = '<small style="color:gray">GROUPS</small>';
    groups.forEach(g => {
        d.innerHTML += `<div class="item ${currChat===g?'active':''}" onclick="selectChat('${g}', true)"># ${g}</div>`;
    });
    d.innerHTML += '<br><small style="color:gray">FRIENDS</small>';
    friends.forEach(f => {
        d.innerHTML += `<div class="item ${currChat===f.name?'active':''}" onclick="selectChat('${f.name}', false)">
            ${f.name} <div class="status ${f.status.toLowerCase()}"></div></div>`;
    });
}

async function selectChat(name, g) {
    currChat = name; isGroup = g;
    document.getElementById('chat-title').innerText = (g ? '# ' : '') + name;
    document.getElementById('chat-header').style.visibility = 'visible';
    document.getElementById('input-area').style.visibility = 'visible';
    document.getElementById('btn-add-mem').style.display = g ? 'inline' : 'none';
    
    // Load Local History First
    const res = await fetch(`/api/history?target=${name}`);
    const hist = await res.json();
    document.getElementById('msgs').innerHTML = '';
    hist.forEach(h => renderMsg({from:h.sender, content:h.content, is_file:h.is_file, time:h.time}));
    
    // Trigger server fetch for sync
    updateFeed(); 
}

function renderMsg(m) {
    const d = document.getElementById('msgs');
    const div = document.createElement('div');
    div.className = `msg ${m.from === myUser ? 'me' : 'other'}`;
    
    let body = m.is_file 
        ? `<a href="/static/uploads/${m.content}" target="_blank" style="color:inherit">📄 ${m.content}</a>` 
        : m.content;
        
    div.innerHTML = `<small style="opacity:0.7;font-size:0.7em">${m.from}</small><br>${body}<br><small style="opacity:0.7;font-size:0.7em">${m.time}</small>`;
    d.appendChild(div);
    d.scrollTop = d.scrollHeight;
}

async function sendMsg() {
    const i = document.getElementById('msg-in');
    if(!i.value) return;
    await api('send', {to: currChat, is_group: isGroup, msg: i.value});
    i.value = '';
}

async function uploadFile() {
    const f = document.getElementById('file-in').files[0];
    if(!f) return;
    const fd = new FormData();
    fd.append('file', f);
    fd.append('to', currChat);
    fd.append('is_group', isGroup);
    await fetch('/api/upload', {method:'POST', body:fd});
}

// --- Actions ---
function addFriend() {
    const n = prompt("Username:");
    if(n) api('action', {command:'ADD_FRIEND', friend:n});
}
function createGroup() {
    const n = prompt("Group Name:");
    if(n) api('action', {command:'CREATE_GROUP', name:n});
}
function addMember() {
    const n = prompt("Username to add:");
    if(n) api('action', {command:'ADD_MEMBER', group:currChat, member:n});
}

// ================== WebRTC GROUP MESH ==================

async function startCall(type) {
    currentRoom = isGroup ? currChat : [myUser, currChat].sort().join('_');
    
    try {
        localStream = await navigator.mediaDevices.getUserMedia({
            audio: true, 
            video: type === 'video'
        });
        document.getElementById('local-video').srcObject = localStream;
        document.getElementById('call-modal').style.display = 'flex';
        
        // Join Room on Server
        api('action', {command: 'JOIN_CALL', room: currentRoom, call_type: type});
        
    } catch(e) {
        alert("Media Error: " + e);
    }
}

function createPeer(user) {
    const pc = new RTCPeerConnection(rtcConfig);
    peers[user] = pc;

    // Add local tracks
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    // On Ice Candidate -> Send to peer
    pc.onicecandidate = e => {
        if(e.candidate) {
            api('action', {command: 'SIGNAL', to: user, signal: {type: 'candidate', candidate: e.candidate}});
        }
    };

    // On Track -> Render remote video
    pc.ontrack = e => {
        let vid = document.getElementById(`vid-${user}`);
        if (!vid) {
            const div = document.createElement('div');
            div.style.position = 'relative';
            vid = document.createElement('video');
            vid.id = `vid-${user}`;
            vid.autoplay = true;
            vid.playsInline = true;
            vid.srcObject = e.streams[0];
            
            const lbl = document.createElement('div');
            lbl.innerText = user;
            lbl.style = "position:absolute;bottom:5px;left:5px;color:white;background:rgba(0,0,0,0.5);padding:2px 5px;border-radius:4px";
            
            div.appendChild(vid);
            div.appendChild(lbl);
            document.getElementById('video-grid').appendChild(div);
        }
    };
    
    return pc;
}

async function initiateConnection(user) {
    const pc = createPeer(user);
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    api('action', {command: 'SIGNAL', to: user, signal: {type: 'offer', sdp: offer}});
}

async function handleSignal(user, signal) {
    let pc = peers[user];
    
    if (signal.type === 'offer') {
        if(!pc) pc = createPeer(user);
        await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        api('action', {command: 'SIGNAL', to: user, signal: {type: 'answer', sdp: answer}});
    }
    else if (signal.type === 'answer') {
        if(pc) await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
    }
    else if (signal.type === 'candidate') {
        if(pc) await pc.addIceCandidate(new RTCIceCandidate(signal.candidate));
    }
}

function removePeer(user) {
    if(peers[user]) {
        peers[user].close();
        delete peers[user];
    }
    const v = document.getElementById(`vid-${user}`);
    if(v) v.parentElement.remove();
}

function leaveCall() {
    if(localStream) localStream.getTracks().forEach(t => t.stop());
    Object.keys(peers).forEach(u => removePeer(u));
    api('action', {command: 'LEAVE_CALL', room: currentRoom});
    document.getElementById('call-modal').style.display = 'none';
}

</script>
</body>
</html>
